{% extends "auctions/layout.html" %}

{% block body %}
    <h1>Categories</h1>
    <ul class="list-group">
        {% for category in categories %}
            <li class="list-group-item">
                <a class="btn btn-primary" href="{% url 'category' title=category %}">{{category}}</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
